name: Build CHORTKE APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find CHORTKE ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f \( -iname "7BOX*.zip" -o -iname "CHORTKE*.zip" \) | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: CHORTKE ZIP file was not found."
            echo "Repository files:"
            ls -la
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract CHORTKE project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted contents:"
          find extracted -maxdepth 4 -type f | sort

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts was not found."
            echo ""
            echo "Searching extracted files:"
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory was not found."
            echo ""
            echo "Project contents:"
            find "$PROJECT_DIR" -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Find CHORTKE UI code
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CHORTKE UI FILES"
          echo "========================================"

          find "$PROJECT_DIR/app/src/main" -type f \
            \( \
              -path "*/res/layout/*" \
              -o -path "*/res/values/*" \
              -o -name "*.kt" \
              -o -name "*.java" \
            \) \
            | sort

          echo ""
          echo "========================================"
          echo "SEARCHING FOR RELEVANT TEXT"
          echo "========================================"

          grep -RniE -C 15 \
            'تومان|ارزش فعلی|نمودار|افزودن|تنظیمات|HOSSEIN|سرمایه' \
            "$PROJECT_DIR/app/src/main" || true

          echo ""
          echo "========================================"
          echo "END UI SEARCH"
          echo "========================================"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "Searching for sdkmanager..."

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name "sdkmanager" \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "sdkmanager found:"
          echo "$SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          echo "Using:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version

          echo ""
          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses || true

          echo ""
          echo "Installing platform-tools..."

          "$SDKMANAGER" "platform-tools"

          echo ""
          echo "Installing Android platform 35..."

          "$SDKMANAGER" "platforms;android-35"

          echo ""
          echo "Installing build tools 35.0.0..."

          "$SDKMANAGER" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check build environment
        shell: bash
        run: |
          echo "================================"
          echo "JAVA"
          echo "================================"
          java -version

          echo ""
          echo "================================"
          echo "GRADLE"
          echo "================================"
          gradle --version

          echo ""
          echo "================================"
          echo "ANDROID SDK"
          echo "================================"
          echo "SDK: $ANDROID_HOME"
          echo "SDK Manager: $SDKMANAGER"

          echo ""
          echo "Installed Android SDK packages:"
          "$SDKMANAGER" --list_installed | head -n 80

      - name: Decode CHORTKE release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.CHORTKE_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: CHORTKE_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chortke-release.jks"

          if [ ! -s "$RUNNER_TEMP/chortke-release.jks" ]; then
            echo "ERROR: Release keystore could not be created."
            exit 1
          fi

          echo "Release keystore prepared successfully."

      - name: Build signed CHORTKE Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.CHORTKE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CHORTKE_KEY_ALIAS }}
        run: |
          set -e

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: CHORTKE_KEYSTORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: CHORTKE_KEY_ALIAS secret is missing."
            exit 1
          fi

          cd "$PROJECT_DIR"

          echo "================================"
          echo "CHORTKE RELEASE BUILD"
          echo "================================"

          gradle assembleRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/chortke-release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - name: Find generated Release APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated Release APK..."

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*-release.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Release APK was not generated."

            echo ""
            echo "Searching for any APK:"
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo ""
          echo "================================"
          echo "RELEASE APK GENERATED SUCCESSFULLY"
          echo "================================"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Upload CHORTKE Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CHORTKE-RELEASE-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
